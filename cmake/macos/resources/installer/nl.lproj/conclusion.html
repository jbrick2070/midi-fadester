<ol>
<li>Is OBS open, sluit het dan af en open het opnieuw.</li>
<li>Sluit je controller aan. Met een APC40 mkII gaat het dock Fadester Desk de eerste keer vanzelf open.</li>
<li>Al het andere staat onder Tools → Midi Fadester.</li>
