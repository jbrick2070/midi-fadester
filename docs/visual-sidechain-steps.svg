<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">Visual Sidechain in three steps</title>
  <desc id="d">1: install Midi Fadester; Visual Sidechain comes with it. 2: in a source's Filters, press plus and add Visual Sidechain: Shader Filter. 3: play music and the picture moves with the sound.</desc>
  <style>
    .card { fill: #ffffff; stroke: #cfe0d5; stroke-width: 2; }
    .num { fill: #236044; }
    .numt { fill: #ffffff; font: 700 22px system-ui, "Segoe UI", sans-serif; }
    .h { fill: #162922; font: 700 21px system-ui, "Segoe UI", sans-serif; }
    .s { fill: #3d5a4c; font: 15px system-ui, "Segoe UI", sans-serif; }
    .ink { stroke: #236044; stroke-width: 3; fill: none; }
    .pale { fill: #eef4ef; stroke: #236044; stroke-width: 3; }
    .amber { fill: #e9a84a; }
    .row { fill: #cfe0d5; }
    .lbl { fill: #236044; font: 700 12px system-ui, "Segoe UI", sans-serif; }
    .arrow { fill: #9bb8a8; }
  </style>
  <rect x="0" y="0" width="900" height="300" rx="18" fill="#eef4ef"/>

  <!-- 1: install -->
  <rect class="card" x="20" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="52" cy="52" r="18"/><text class="numt" x="52" y="60" text-anchor="middle">1</text>
  <rect class="pale" x="92" y="120" width="116" height="66" rx="10"/>
  <line class="ink" x1="92" y1="140" x2="208" y2="140"/>
  <rect x="112" y="152" width="76" height="10" rx="5" fill="#cfe0d5"/><rect x="112" y="152" width="50" height="10" rx="5" fill="#236044"/>
  <rect x="112" y="168" width="40" height="10" rx="5" class="amber"/>
  <line x1="150" y1="72" x2="150" y2="108" stroke="#236044" stroke-width="5" stroke-linecap="round"/>
  <path d="M134 98 l16 18 16 -18 z" fill="#236044"/>
  <text class="h" x="150" y="222" text-anchor="middle">Install Midi Fadester</text>
  <text class="s" x="150" y="246" text-anchor="middle">Visual Sidechain</text>
  <text class="s" x="150" y="266" text-anchor="middle">comes with it</text>

  <path class="arrow" d="M288 142 l14 8 -14 8 z"/>

  <!-- 2: add the filter -->
  <rect class="card" x="320" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="352" cy="52" r="18"/><text class="numt" x="352" y="60" text-anchor="middle">2</text>
  <rect class="pale" x="370" y="74" width="160" height="116" rx="10"/>
  <text class="lbl" x="384" y="96">Filters</text>
  <line class="ink" x1="370" y1="106" x2="530" y2="106"/>
  <rect class="row" x="384" y="118" width="100" height="14" rx="4"/>
  <rect class="amber" x="384" y="140" width="132" height="16" rx="4"/>
  <text class="lbl" x="390" y="152" fill="#1b382d">Shader Filter</text>
  <circle cx="400" cy="174" r="11" fill="#236044"/><text x="400" y="179" text-anchor="middle" fill="#ffffff" font-family="system-ui, 'Segoe UI', sans-serif" font-weight="700" font-size="16">+</text>
  <text class="h" x="450" y="222" text-anchor="middle">Add the filter</text>
  <text class="s" x="450" y="246" text-anchor="middle">Filters, +, Visual Sidechain:</text>
  <text class="s" x="450" y="266" text-anchor="middle">Shader Filter</text>

  <path class="arrow" d="M588 142 l14 8 -14 8 z"/>

  <!-- 3: play music -->
  <rect class="card" x="620" y="20" width="260" height="260" rx="16"/>
  <circle class="num" cx="652" cy="52" r="18"/><text class="numt" x="652" y="60" text-anchor="middle">3</text>
  <!-- note -->
  <ellipse cx="676" cy="158" rx="11" ry="8" fill="#236044"/><line x1="686" y1="158" x2="686" y2="108" stroke="#236044" stroke-width="3"/>
  <path d="M686 108 q14 6 14 22" class="ink"/>
  <!-- waveform -->
  <path class="ink" d="M704 136 l6 -14 6 28 6 -36 6 44 6 -30 6 18 6 -10"/>
  <!-- screen with rings -->
  <rect class="pale" x="760" y="88" width="100" height="80" rx="8"/>
  <circle cx="810" cy="128" r="10" class="amber"/>
  <circle cx="810" cy="128" r="22" fill="none" stroke="#e9a84a" stroke-width="3"/>
  <circle cx="810" cy="128" r="34" fill="none" stroke="#236044" stroke-width="2" opacity="0.6"/>
  <text class="h" x="750" y="222" text-anchor="middle">Play music</text>
  <text class="s" x="750" y="246" text-anchor="middle">The picture moves</text>
  <text class="s" x="750" y="266" text-anchor="middle">with the sound</text>
</svg>
