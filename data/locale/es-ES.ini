Desk.Help.Title="Qué hacen los pads"
Desk.Help.Pads="Las columnas 1–8 son las fuentes de la escena en directo, empezando por la capa inferior: los faders vacíos se rellenan solos y siguen a la escena; un fader que configures tú se mantiene. Fusión (fila inferior de pads del APC40): la otra fusión de la fuente (Shift: siguiente fusión). Destello: al 100 % mientras se mantiene (Shift: oscuro mientras se mantiene). Fundir: fundido de salida y vuelta (Shift: corte de salida). Mostrar / ocultar: el ojo de la fuente en OBS (Shift: mostrar al 100 %). Fundido, tiempos (fila superior): el pad amarillo hace un corte de la vista previa al directo; los pads verdes la funden en 32, 16, 8, 4, 2, 1 o ½ tiempos. Restablecer (Clip Stop en el APC40): devuelve esa columna a su propia fusión (Shift: fijar la columna a su fuente). Restablecer todo (Stop All Clips): todos los efectos apagados y cada fuente de vuelta a su propia fusión (Shift: fundido de salida de todas las fuentes)."
Desk.Help.Speed="Velocidad del vídeo (con Fadester Companion y VJster en marcha): la perilla Tempo acelera o frena el vídeo 0,05x por paso (Shift + Tempo: 0,25x), Nudge − / + lo frena o acelera 0,25x, Tap Tempo lo devuelve a 1x y Play lo reproduce o lo pausa. Pasa por VJster porque una fuente multimedia de OBS se reinicia al cambiar su velocidad."
Desk.Help.Scenes="Los cinco botones de escena (Scene Launch 1–5 en el APC40) son las cinco primeras escenas de la lista Escenas. Pulsa una vez para la vista previa y otra vez para fundirla al directo; Shift + botón (Ctrl-clic en el panel, Cmd-clic en un Mac) la envía directamente al directo. En directo en rojo, vista previa en verde. A negro (Session): el público ve negro, y la imagen vuelve en la siguiente pulsación. Mando Cue Level: duración de la transición (Shift: tiempo de fundido de las fuentes). Pánico (Record): todos los efectos de Visual Sidechain apagados, y después Restaurar. Tap (Metronome): su Tap Tempo (Shift: Fijar BPM). Shift + Tap Tempo: Tiempo 1."
