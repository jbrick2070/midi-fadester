Dialog.VjSpeedLegend="Videosnelheid (met Fadester Companion en VJster actief): de Tempo-knop maakt de video per klik 0,05x sneller of langzamer (Shift + Tempo: 0,25x), Nudge − / + 0,25x langzamer of sneller, Tap Tempo zet hem terug op 1x, Play speelt hem af of pauzeert hem. Dit gaat via VJster, omdat een OBS-mediabron opnieuw start als de snelheid verandert."
Dialog.VjPadsLegend="Kolommen 1–8 zijn de bronnen van de live scène, onderste laag eerst: lege faders vullen zichzelf en volgen de scène; een fader die je zelf hebt ingesteld blijft staan. Onderste padrij: overvloeipunch (Shift + pad: volgende punchmodus). Rij 2: flits zolang je vasthoudt (Shift: black-out). Rij 3: uitfaden en terug (Shift: direct). Rij 4: bron tonen of verbergen (Shift: wekken). Rij 5: scènefades, van Voorvertoning naar Programma over 8 maten links tot 1/4 tel rechts (Shift: cut). Clip Stop: die kolom terug naar zijn eigen overvloeimodus (Shift: kolom aan zijn bron vastzetten). Stop All Clips: schoon, alle effecten uit en elke bron terug naar zijn eigen overvloeimodus (Shift: alle lagen uitfaden)."
Dialog.VjScenesLegend="Scene Launch 1–5: de eerste vijf scènes in de lijst Scènes. Druk eenmaal voor Voorvertoning, nogmaals om hem naar Programma te faden; Shift + knop stuurt hem rechtstreeks naar Programma. Programma rood, Voorvertoning groen. Session: Programma fadet naar zwart, en bij de volgende druk weer terug. Cue Level: overgangsduur (Shift: fadetijd van de pads). Record: Visual Sidechain paniek of herstellen. Metronome: de Tap Tempo ervan (Shift: BPM vergrendelen). Shift + Tap Tempo: terug naar de eerste tel."
