Desk.Help.Title="Wat de pads doen"
Desk.Help.Pads="Kolommen 1–8 zijn de bronnen van de live scène, onderste laag eerst: lege faders vullen zichzelf en volgen de scène; een fader die je zelf hebt ingesteld blijft staan. Overvloeien (onderste padrij op de APC40): de andere overvloeimodus van de bron (Shift: volgende modus). Flits: 100 % zolang je vasthoudt (Shift: donker zolang je vasthoudt). Uitfaden: uitfaden en terug (Shift: direct uit). Aan / uit: het oog van de bron in OBS (Shift: tonen op 100 %). Fade, tellen (bovenste rij): de gele pad schakelt de voorvertoning met een cut live; de groene pads faden hem over 32, 16, 8, 4, 2, 1 of ½ tellen. Reset (Clip Stop op de APC40): die kolom terug naar zijn eigen overvloeimodus (Shift: kolom aan zijn bron vastzetten). Alles resetten (Stop All Clips): alle effecten uit en elke bron terug naar zijn eigen overvloeimodus (Shift: elke bron uitfaden)."
Desk.Help.Speed="Videosnelheid (met Fadester Companion en VJster actief): de Tempo-knop maakt de video per klik 0,05x sneller of langzamer (Shift + Tempo: 0,25x), Nudge − / + 0,25x langzamer of sneller, Tap Tempo zet hem terug op 1x, Play speelt hem af of pauzeert hem. Dit gaat via VJster, omdat een OBS-mediabron opnieuw start als de snelheid verandert."
Desk.Help.Scenes="De vijf scèneknoppen (Scene Launch 1–5 op de APC40) zijn de eerste vijf scènes in de lijst Scènes. Druk eenmaal voor de voorvertoning, nogmaals om hem live te faden; Shift + knop (Ctrl-klik in het dock, Cmd-klik op een Mac) stuurt hem rechtstreeks live. Live rood, voorvertoning groen. Black-out (Session): het publiek ziet zwart, en bij de volgende druk komt het beeld terug. Cue Level-knop: overgangsduur (Shift: fadetijd van de bronnen). Paniek (Record): alle effecten van Visual Sidechain uit, daarna Herstel. Tap (Metronome): de Tap Tempo ervan (Shift: BPM vast). Shift + Tap Tempo: Tel 1."
