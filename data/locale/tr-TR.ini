Desk.Help.Title="Pedler ne yapar"
Desk.Help.Pads="1–8. sütunlar yayındaki sahnenin kaynaklarıdır, en alttaki katmandan başlar: boş fader'lar kendiliğinden dolar ve sahneyi izler; kendi ayarladığınız fader sabit kalır. Karışım (APC40'ta alt ped sırası): kaynağın diğer karışımı (Shift: sonraki karışım). Flaş: basılı tutarken yüzde 100 (Shift: basılı tutarken karanlık). Karart: karartıp geri getir (Shift: anında kapat). Göster / gizle: kaynağın OBS'teki göz simgesi (Shift: yüzde 100 göster). Geçiş, vuruş (üst sıra): sarı ped önizlemeyi yayına keser; yeşil pedler 32, 16, 8, 4, 2, 1 veya ½ vuruşta geçiş yapar. Sıfırla (APC40'ta Clip Stop): o sütunu kendi karışımına döndürür (Shift: sütunu kaynağına sabitle). Tümünü sıfırla (Stop All Clips): tüm efektler kapalı ve her kaynak kendi karışımına döner (Shift: tüm kaynakları karartarak kapat)."
Desk.Help.Speed="Video hızı (Fadester Companion ve VJster çalışırken): Tempo düğmesi videoyu her tıkta 0,05x hızlandırır veya yavaşlatır (Shift + Tempo: 0,25x), Nudge − / + 0,25x yavaşlatır veya hızlandırır, Tap Tempo 1x'e döndürür, Play oynatır veya duraklatır. Bir OBS medya kaynağı hızı değişince baştan başladığı için bu VJster üzerinden yapılır."
Desk.Help.Scenes="Beş sahne düğmesi (APC40'ta Scene Launch 1–5), Sahneler listesindeki ilk beş sahnedir. Önizleme için bir kez, yayına geçirmek için yeniden basın; Shift + düğme (panelde Ctrl-tıkla, Mac'te Cmd-tıkla) doğrudan yayına gönderir. Yayındaki kırmızı, önizleme yeşil. Karartma (Session): seyirci siyah görür, bir sonraki basışta görüntü geri gelir. Cue Level düğmesi: geçiş süresi (Shift: kaynak geçiş süresi). Panik (Record): tüm Visual Sidechain efektleri kapanır, ardından Geri yükle. Tap (Metronome): onun Tap Tempo'su (Shift: BPM sabitle). Shift + Tap Tempo: 1. vuruş."
