Dialog.VjFadeTime="Ped geçiş süresi:"
Dialog.VjSpeedLegend="Video hızı (Fadester Companion ve VJster çalışırken): Tempo düğmesi videoyu her tıkta 0,05x hızlandırır veya yavaşlatır (Shift + Tempo: 0,25x), Nudge − / + 0,25x yavaşlatır veya hızlandırır, Tap Tempo 1x'e döndürür, Play oynatır veya duraklatır. Bir OBS medya kaynağı hızı değişince baştan başladığı için bu VJster üzerinden yapılır."
Dialog.VjPadsLegend="1–8. sütunlar yayındaki sahnenin kaynaklarıdır, en alttaki katmandan başlar: boş fader'lar kendiliğinden dolar ve sahneyi izler; kendi ayarladığınız fader sabit kalır. Alt ped sırası: karışım vuruşu (Shift + ped: sonraki vuruş modu). 2. sıra: basılı tutarken flaş (Shift: karartma). 3. sıra: karartıp geri getir (Shift: anında). 4. sıra: kaynağı göster veya gizle (Shift: uyandır). 5. sıra: sahne geçişleri, Önizleme'den Program'a solda 8 ölçüden sağda 1/4 vuruşa kadar (Shift: kes). Clip Stop: o sütunu kendi karışım moduna döndürür (Shift: sütunu kaynağına sabitle). Stop All Clips: temiz, tüm efektler kapalı ve her kaynak kendi karışım moduna döner (Shift: tüm katmanları karartarak kapat)."
Dialog.VjScenesLegend="Scene Launch 1–5: Sahneler listesindeki ilk beş sahne. Önizleme için bir kez, Program'a geçiş yapmak için yeniden basın; Shift + düğme doğrudan Program'a gönderir. Program kırmızı, Önizleme yeşil. Session: Program siyaha geçer, bir sonraki basışta geri döner. Cue Level: geçiş süresi (Shift: ped geçiş süresi). Record: Visual Sidechain panik veya geri yükle. Metronome: onun Tap Tempo'su (Shift: BPM'i kilitle). Shift + Tap Tempo: ilk vuruşa dön."
