Desk.Help.Title="打击垫的功能"
Desk.Help.Pads="第 1–8 列对应正在输出的场景中的源，从最底层开始：空推子会自动填充并跟随场景，您自行设置的推子保持不变。混合（APC40 最下排打击垫）：该源的另一种混合（Shift：下一种混合）。闪烁：按住时为 100%（Shift：按住时变暗）。淡出：淡出再恢复（Shift：立即切出）。显示 / 隐藏：该源在 OBS 中的眼睛图标（Shift：以 100% 显示）。淡变（拍）（最上排）：黄色打击垫将预览直接切换至输出；绿色打击垫在 32、16、8、4、2、1 或 ½ 拍内将其淡变。重置（APC40 上的 Clip Stop）：将该列恢复为其自身的混合（Shift：将该列固定到当前源）。全部重置（Stop All Clips）：关闭所有效果并把每个源恢复为其自身的混合（Shift：所有源淡出）。"
Desk.Help.Speed="视频速度（Fadester Companion 和 VJster 运行时）：Tempo 旋钮每转一格让视频快或慢 0.05x（Shift + Tempo：0.25x），Nudge − / + 慢或快 0.25x，Tap Tempo 恢复到 1x，Play 播放或暂停。之所以通过 VJster，是因为 OBS 媒体源在速度改变时会从头重新播放。"
Desk.Help.Scenes="五个场景按钮（APC40 上的 Scene Launch 1–5）对应场景列表中的前五个场景。按一次进入预览，再按一次将其淡变至输出；Shift + 按钮（停靠窗口中为 Ctrl+点击，Mac 上为 Cmd+点击）直接送至输出。正在输出为红色，预览为绿色。黑场（Session）：观众看到黑屏，下次按下时画面恢复。Cue Level 旋钮：转场时长（Shift：源淡变时间）。紧急关闭（Record）：关闭所有 Visual Sidechain 效果，之后按“恢复”。打拍（Metronome）：其 Tap Tempo（Shift：固定 BPM）。Shift + Tap Tempo：第一拍。"
