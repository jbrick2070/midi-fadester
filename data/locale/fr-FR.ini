Dialog.VjFadeTime="Durée de fondu des pads :"
Dialog.VjSpeedLegend="Vitesse de la vidéo (avec Fadester Companion et VJster lancés) : le bouton Tempo accélère ou ralentit la vidéo de 0,05x par cran (Shift + Tempo : 0,25x), Nudge − / + la ralentit ou l’accélère de 0,25x, Tap Tempo la remet à 1x, Play la lit ou la met en pause. Cela passe par VJster, car une source multimédia OBS redémarre quand sa vitesse change."
Dialog.VjPadsLegend="Les colonnes 1–8 sont les sources de la scène à l’antenne, en commençant par le calque du bas : les faders vides se remplissent seuls et suivent la scène ; un fader que vous réglez vous-même reste en place. Rangée de pads du bas : fusion en un coup (Shift + pad : mode suivant). Rangée 2 : flash tant que le pad est tenu (Shift : noir complet). Rangée 3 : fondu de sortie puis retour (Shift : instantané). Rangée 4 : afficher ou masquer la source (Shift : la réveiller). Rangée 5 : le pad 1 (jaune) fait une coupure de l’Aperçu vers le Programme ; les pads 2–8 le passent en fondu au rythme du beat, de 8 mesures jusqu’à 1/2 temps. Clip Stop : remet cette colonne sur son propre mode de fusion (Shift : épingler la colonne à sa source). Stop All Clips : propre, tous les effets coupés et chaque source remise sur son propre mode de fusion (Shift : fondu de sortie de tous les calques)."
Dialog.VjScenesLegend="Scene Launch 1–5 : les cinq premières scènes de la liste Scènes. Appuyez une fois pour l’Aperçu, encore une fois pour la passer en fondu vers le Programme ; Shift + bouton l’envoie directement au Programme. Programme rouge, Aperçu vert. Session : le Programme fond au noir, et revient à l’appui suivant. Cue Level : durée de transition (Shift : durée de fondu des pads). Record : panique ou rétablissement de Visual Sidechain. Metronome : son Tap Tempo (Shift : verrouiller le BPM). Shift + Tap Tempo : retour sur son premier temps."
