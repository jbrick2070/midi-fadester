Dialog.DeskVideo="Показывать на док-панели управление скоростью видео (нужны Fadester Companion и VJster)"
Dialog.VjSpeedLegend="Скорость видео (при запущенных Fadester Companion и VJster): ручка Tempo ускоряет или замедляет видео на 0,05x за щелчок (Shift + Tempo: 0,25x), Nudge − / + замедляет или ускоряет на 0,25x, Tap Tempo возвращает 1x, Play запускает или ставит на паузу. Управление идёт через VJster, потому что медиаисточник OBS перезапускается при смене скорости."
Dialog.VjPadsLegend="Столбцы 1–8 — источники сцены в эфире, начиная с нижнего слоя: пустые фейдеры заполняются сами и следуют за сценой; настроенный вами фейдер остаётся. Нижний ряд пэдов: удар наложения (Shift + пэд: следующий режим удара). Ряд 2: вспышка, пока пэд нажат (Shift: затемнение). Ряд 3: плавно убрать и вернуть (Shift: мгновенно). Ряд 4: показать или скрыть источник (Shift: разбудить его). Ряд 5: пэд 1 (жёлтый) выполняет резкую смену из Предпросмотра в Передачу; пэды 2–8 запускают плавный переход в такт биту, от 8 тактов до 1/2 доли. Clip Stop: вернуть этот столбец к его собственному режиму наложения (Shift: закрепить столбец за источником). Stop All Clips: чисто, все эффекты выключены и каждый источник возвращён к своему режиму наложения (Shift: увести в затухание все слои)."
Dialog.VjScenesLegend="Scene Launch 1–5: первые пять сцен в списке «Сцены». Нажмите один раз для Предпросмотра, ещё раз — для плавного перехода в Передачу; Shift + кнопка отправляет её сразу в Передачу. Передача красная, Предпросмотр зелёный. Session: Передача плавно уходит в чёрный, а при следующем нажатии возвращается. Cue Level: длительность перехода (Shift: время затухания пэдов). Record: паника или восстановление Visual Sidechain. Metronome: его Tap Tempo (Shift: зафиксировать BPM). Shift + Tap Tempo: сброс на сильную долю."
