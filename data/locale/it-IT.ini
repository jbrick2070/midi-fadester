Desk.Help.Title="Cosa fanno i pad"
Desk.Help.Pads="Le colonne 1–8 sono le fonti della scena in onda, dal livello più basso: i fader vuoti si riempiono da soli e seguono la scena; un fader che imposti tu resta. Fusione (la fila di pad più bassa sull'APC40): l'altra fusione della fonte (Shift: fusione successiva). Flash: 100 % finché tieni premuto (Shift: scuro finché tieni premuto). Dissolvi: fuori e ritorno (Shift: stacco in uscita). Mostra / nascondi: l'occhio della fonte in OBS (Shift: mostra al 100 %). Sfuma, battiti (la fila in alto): il pad giallo manda l'Anteprima in onda con uno stacco; i pad verdi la sfumano in 32, 16, 8, 4, 2, 1 o ½ battiti. Azzera (Clip Stop sull'APC40): quella colonna torna alla sua fusione (Shift: fissa la colonna alla sua fonte). Azzera tutto (Stop All Clips): ogni effetto spento e ogni fonte torna alla sua fusione (Shift: sfuma via tutte le fonti)."
Desk.Help.Speed="Velocità video (con Fadester Companion e VJster in funzione): la manopola Tempo rende il video 0,05x più veloce o più lento a ogni scatto (Shift + Tempo: 0,25x), Nudge − / + 0.25x più lento o più veloce, Tap Tempo torna a 1x, Play lo avvia o lo mette in pausa. Passa da VJster perché una fonte multimediale di OBS riparte quando cambia velocità."
Desk.Help.Scenes="I cinque pulsanti scena (Scene Launch 1–5 sull'APC40) sono le prime cinque scene dell'elenco Scene. Premi una volta per l'Anteprima, di nuovo per sfumarla in onda; Shift + pulsante (Ctrl-clic sul pannello, Cmd-clic su Mac) la manda subito in onda. In onda rosso, Anteprima verde. Nero (Session): il pubblico vede nero, e l'immagine torna alla pressione successiva. Manopola Cue Level: durata della transizione (Shift: durata dissolvenza fonti). Panico (Record): tutti gli effetti di Visual Sidechain spenti, poi Ripristina. Tap (Metronome): il suo tap tempo (Shift: Blocca BPM). Shift + Tap Tempo: Battito 1."
