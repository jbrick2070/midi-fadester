Desk.Help.Title="パッドの働き"
Desk.Help.Pads="列 1–8 は出力中のシーンのソースです (下のレイヤーから順): 空のフェーダーは自動で割り当てられてシーンに追従し、自分で設定したフェーダーはそのまま残ります。ブレンド (APC40 の下段のパッド): ソースのもう一つのブレンド (Shift: 次のブレンド)。フラッシュ: 押している間 100% (Shift: 押している間暗転)。フェードアウト: フェードアウトして戻る (Shift: 即時オフ)。表示 / 非表示: OBS でのソースの目のアイコン (Shift: 100% で表示)。フェード (拍) (上段): 黄色のパッドはプレビューを出力へカットし、緑のパッドは 32、16、8、4、2、1、½ 拍かけてフェードします。リセット (APC40 の Clip Stop): その列を本来のブレンドに戻す (Shift: 列をそのソースに固定)。すべてリセット (Stop All Clips): すべてのエフェクトをオフにし、すべてのソースを本来のブレンドに戻します (Shift: すべてのソースをフェードアウト)。"
Desk.Help.Speed="動画の速度（Fadester Companion と VJster の実行中）：Tempo ノブは 1 クリックごとに動画を 0.05x 速く／遅くします（Shift + Tempo：0.25x）。Nudge − / + は 0.25x 遅く／速く、Tap Tempo は 1x に戻し、Play は再生／一時停止します。OBS のメディアソースは速度を変えると最初から再生し直すため、VJster を通して操作します。"
Desk.Help.Scenes="5 つのシーンボタン (APC40 の Scene Launch 1–5) はシーン一覧の先頭 5 つのシーンです。1 回押すとプレビュー、もう一度押すと出力へフェード、Shift + ボタン (ドックでは Ctrl + クリック、Mac では Cmd + クリック) で直接出力へ送ります。出力中は赤、プレビューは緑。ブラックアウト (Session): 観客には黒い画面が見え、次に押すと映像が戻ります。Cue Level ノブ: トランジション時間 (Shift: ソースのフェード時間)。パニック (Record): Visual Sidechain のエフェクトをすべてオフ、その後「復元」。タップ (Metronome): その Tap Tempo (Shift: BPM 固定)。Shift + Tap Tempo: 1 拍目。"
