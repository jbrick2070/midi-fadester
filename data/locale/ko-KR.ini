Dialog.DeskVideo="독에 동영상 속도 컨트롤 표시 (Fadester Companion과 VJster 필요)"
Dialog.VjSpeedLegend="동영상 속도(Fadester Companion과 VJster 실행 중): Tempo 노브는 한 칸마다 동영상을 0.05x 빠르게 또는 느리게 하고(Shift + Tempo: 0.25x), Nudge − / +는 0.25x 느리게 또는 빠르게, Tap Tempo는 1x로 되돌리며, Play는 재생하거나 일시 정지합니다. OBS 미디어 소스는 속도를 바꾸면 처음부터 다시 재생되므로 VJster를 거칩니다."
Dialog.VjPadsLegend="1–8열은 송출 중인 장면의 소스이며 아래 레이어부터 배치됩니다. 빈 페이더는 자동으로 채워져 장면을 따라가고, 직접 설정한 페이더는 그대로 유지됩니다. 아래쪽 패드 줄: 블렌드 펀치(Shift + 패드: 다음 펀치 모드). 2번째 줄: 누르고 있는 동안 플래시(Shift: 블랙아웃). 3번째 줄: 페이드아웃 후 복귀(Shift: 즉시 전환). 4번째 줄: 소스 표시/숨기기(Shift: 깨우기). 5번째 줄: 패드 1(노란색)은 미리보기를 프로그램으로 컷하고, 패드 2–8은 비트에 맞춰 8마디에서 1/2박까지 페이드합니다. Clip Stop: 해당 열을 원래 블렌드 모드로 되돌림(Shift: 열을 해당 소스에 고정). Stop All Clips: 클린. 모든 효과를 끄고 모든 소스를 원래 블렌드 모드로 되돌립니다(Shift: 모든 레이어 페이드아웃)."
Dialog.VjScenesLegend="Scene Launch 1–5: 장면 목록의 처음 다섯 장면. 한 번 누르면 미리보기, 다시 누르면 프로그램으로 페이드되며 Shift + 버튼은 바로 프로그램으로 보냅니다. 프로그램은 빨간색, 미리보기는 초록색. Session: 프로그램이 검은 화면으로 페이드되고, 다음에 누르면 복귀합니다. Cue Level: 전환 길이(Shift: 패드 페이드 시간). Record: Visual Sidechain 패닉 또는 복원. Metronome: 해당 Tap Tempo(Shift: BPM 잠금). Shift + Tap Tempo: 마디 첫 박으로 되돌림."
