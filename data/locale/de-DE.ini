Desk.Help.Title="Was die Pads tun"
Desk.Help.Pads="Spalten 1–8 sind die Quellen der Szene auf Sendung, unterste Ebene zuerst: leere Fader füllen sich selbst und folgen der Szene; ein selbst zugewiesener Fader bleibt. Blend (untere Pad-Reihe am APC40): der andere Blend-Modus der Quelle (Shift: nächster Blend-Modus). Aufblitzen: 100 %, solange gehalten (Shift: dunkel, solange gehalten). Ausblenden: aus- und wieder einblenden (Shift: sofort aus). Ein / aus: das Auge der Quelle in OBS (Shift: auf 100 % zeigen). Blende, Beats (obere Reihe): das gelbe Pad schaltet die Vorschau per Schnitt auf Sendung; die grünen Pads blenden sie über 32, 16, 8, 4, 2, 1 oder ½ Beats. Zurücksetzen (Clip Stop am APC40): diese Spalte zurück auf ihren eigenen Blend-Modus (Shift: Spalte an ihre Quelle anheften). Alles zurücksetzen (Stop All Clips): alle Effekte aus und jede Quelle zurück auf ihren eigenen Blend-Modus (Shift: alle Quellen ausblenden)."
Desk.Help.Speed="Videotempo (wenn Fadester Companion und VJster laufen): Der Tempo-Regler macht das Video pro Raste um 0,05x schneller oder langsamer (Shift + Tempo: 0,25x), Nudge − / + um 0,25x langsamer oder schneller, Tap Tempo setzt es auf 1x zurück, Play spielt es ab oder pausiert es. Das läuft über VJster, weil eine OBS-Medienquelle neu startet, wenn sich ihr Tempo ändert."
Desk.Help.Scenes="Die fünf Szenentasten (Scene Launch 1–5 am APC40) sind die ersten fünf Szenen in der Liste „Szenen“. Einmal drücken für die Vorschau, noch einmal, um sie auf Sendung zu blenden; Shift + Taste (Ctrl-Klick im Dock, Cmd-Klick am Mac) schickt sie direkt auf Sendung. Auf Sendung rot, Vorschau grün. Blackout (Session): Das Publikum sieht Schwarz, und beim nächsten Drücken kommt das Bild zurück. Cue-Level-Regler: Übergangsdauer (Shift: Blendzeit der Quellen). Panik (Record): alle Effekte von Visual Sidechain aus, danach Wiederherstellen. Tap (Metronome): sein Tap Tempo (Shift: BPM halten). Shift + Tap Tempo: Beat 1."
