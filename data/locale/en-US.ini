Desk.Help.Title="What the pads do"
Desk.Help.Pads="Columns 1–8 are the sources of the scene on air, bottom layer first: empty faders fill themselves and follow the scene; a fader you set yourself stays. Blend (the bottom pad row on the APC40): the source's other blend (Shift: next blend). Flash: 100 % while held (Shift: dark while held). Fade out: out and back (Shift: cut out). Show / hide: the source's eye in OBS (Shift: show at 100 %). Fade, beats (the top row): the yellow pad cuts Preview on air; the green pads fade it over 32, 16, 8, 4, 2, 1 or ½ beats. Reset (Clip Stop on the APC40): that column back to its own blend (Shift: pin the column to its source). Reset all (Stop All Clips): every effect off and every source back to its own blend (Shift: fade every source out)."
Desk.Help.Speed="Video speed (with Fadester Companion and VJster running): the Tempo knob makes the video 0.05x faster or slower per click (Shift + Tempo: 0.25x), Nudge − / + 0.25x slower or faster, Tap Tempo back to 1x, Play plays or pauses it. It goes through VJster because an OBS media source restarts when its speed changes."
Desk.Help.Scenes="The five scene buttons (Scene Launch 1–5 on the APC40) are the first five scenes in the Scenes list. Press once for Preview, again to fade it on air; Shift + button (Ctrl-click on the dock, Cmd-click on a Mac) sends it straight on air. On air red, Preview green. Blackout (Session): the audience sees black, and the picture comes back on the next press. Cue Level knob: transition length (Shift: source fade time). Panic (Record): all Visual Sidechain effects off, then Restore. Tap (Metronome): its tap tempo (Shift: Hold BPM). Shift + Tap Tempo: Beat 1."
