Dialog.DeskVideo="Mostrar os controles de velocidade do vídeo no painel (requer Fadester Companion e VJster)"
Dialog.VjSpeedLegend="Velocidade do vídeo (com o Fadester Companion e o VJster em execução): o botão Tempo deixa o vídeo 0,05x mais rápido ou mais lento a cada clique (Shift + Tempo: 0,25x), Nudge − / + 0,25x mais lento ou mais rápido, Tap Tempo volta a 1x e Play reproduz ou pausa. Passa pelo VJster porque uma fonte de mídia do OBS reinicia quando a velocidade muda."
Dialog.VjPadsLegend="As colunas 1–8 são as fontes da cena no ar, da camada inferior para cima: faders vazios se preenchem sozinhos e acompanham a cena; o fader que você configurou permanece. Fileira de baixo: golpe de mesclagem (Shift + pad: próximo modo de golpe). Fileira 2: flash enquanto você segura (Shift: blackout). Fileira 3: fade de saída e volta (Shift: instantâneo). Fileira 4: mostrar ou ocultar a fonte (Shift: acordá-la). Fileira 5: o pad 1 (amarelo) faz um corte da Pré-visualização para o Programa; os pads 2–8 fazem fade no ritmo da batida, de 8 compassos até 1/2 tempo. Clip Stop: volta essa coluna para o seu próprio modo de mesclagem (Shift: fixar a coluna na sua fonte). Stop All Clips: limpo, todos os efeitos desligados e cada fonte de volta ao seu próprio modo de mesclagem (Shift: fade de saída em todas as camadas)."
Dialog.VjScenesLegend="Scene Launch 1–5: as cinco primeiras cenas da lista Cenas. Aperte uma vez para Pré-visualização e outra vez para fazer fade para o Programa; Shift + botão envia direto para o Programa. Programa em vermelho, Pré-visualização em verde. Session: o Programa faz fade para preto, e volta ao apertar de novo. Cue Level: duração da transição (Shift: tempo de fade dos pads). Record: pânico ou restauração do Visual Sidechain. Metronome: o Tap Tempo dele (Shift: travar o BPM). Shift + Tap Tempo: voltar ao primeiro tempo do compasso."
